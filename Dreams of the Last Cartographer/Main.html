<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams of the Last Cartographer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #d4c8a8;
            font-family: 'Times New Roman', serif;
            font-size: 14px;
            overflow: hidden;
            cursor: crosshair;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #mapc {
            display: none;
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 300px;
            opacity: 0.85;
            border: 1px solid #665544;
            border-radius: 4px;
            image-rendering: auto;
            pointer-events: auto;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 400px;
            opacity: 0.9;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            line-height: 1.4;
            z-index: 10;
        }
        #title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
            transition: opacity 5s;
        }
        #instructions {
            font-size: 12px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        #status, #lore {
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        #lore div {
            margin-bottom: 8px;
            opacity: 0.8;
            font-style: italic;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.8; transform: translateY(0); }
        }
        #status {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #665544;
        }
        @media (max-width: 768px) {
            #minimap { width: 200px; height: 200px; bottom: 10px; right: 10px; }
            #ui { left: 10px; top: 10px; font-size: 12px; max-width: 300px; }
            #title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="mapc" width="256" height="256"></canvas>
    <canvas id="minimap" width="300" height="300"></canvas>
    <div id="ui">
        <div id="title">Dreams of the Last Cartographer</div>
        <div id="instructions">
            Drag mouse to explore world. Wheel to zoom. SPACEBAR cycles dream states.<br>
            Drag on minimap to draw maps &amp; preserve reality.
        </div>
        <div id="status">
            Awaiting your quill...
        </div>
        <div id="lore"></div>
    </div>

    <script>
        // Core Constants & Globals (unchanged except perf tweaks)
        const WORLD_SIZE = 4096;
        const WORLD_OFFSET = WORLD_SIZE / 2;
        const MAP_RES = 256;
        const WORLD_CELL_SIZE = WORLD_SIZE / MAP_RES; // ~16px
        const TOTAL_MAP_CELLS = MAP_RES * MAP_RES;
        const DECAY_INTERVAL = 10; // frames
        const DECAY_FACTOR = 0.995;
        const MINIMAP_SIZE = 300;

        let canvas, ctx, mapCanvas, mapCtx, minimapCanvas, minimapCtx;
        let cw, ch;
        let camX = 0, camY = 0, targetCamX = 0, targetCamY = 0;
        let zoom = 0.8, targetZoom = 0.8;
        let dreamState = 0;
        let mapStability = new Float32Array(TOTAL_MAP_CELLS);
        let decayTick = 0;
        let time = 0, prevTime = 0, startTime = performance.now() / 1000;
        let globalStab = 0, instab = 1, mapCnt = 0;
        let statTick = 0;
        let mouse = { x: 0, y: 0, down: false, lastX: 0, lastY: 0 };
        let mapDrawing = false;
        let audioCtx = null;
        let drone = null;
        let audioReady = false;
        let titleEl = document.getElementById('title');
        let statusEl = document.getElementById('status');
        let loreEl = document.getElementById('lore');
        let loreShown = new Set();
        let stars = [];
        let landmarks = [ /* unchanged */ 
            { x: -1200, y: -800, type: 'cathedral', lore: 'The drowned bells still toll in the abyss, calling the faithful to a service long ended.' },
            { x: 1500, y: 900, type: 'staircase', lore: 'Steps to nowhere, climbed by shadows that never tire.' },
            { x: -500, y: 1800, type: 'observatory', lore: 'A silent eye gazes into the unraveling firmament, charting stars that fall upward.' },
            { x: 2000, y: -1400, type: 'kingdom', lore: 'Fractured crowns litter the plains where kings bargained with the horizon.' },
            { x: -1800, y: 600, type: 'coastline', lore: 'Shores where waves climb the sky, and islands drift like forgotten thoughts.' },
            { x: 800, y: -2000, type: 'archive', lore: 'Shelves of crumbling tomes whisper maps of worlds that never were.' }
        ];

        // Noise & FBM (optimized: 3 octaves max)
        function snoise(tx, ty) {
            let n = tx + ty * 57;
            n = (n << 13) ^ n;
            return 1 - ((n = (n * (n * n * 15731 + 789221) + 1376312589) >>> 0) & 0x7fffffff) / 1073741824;
        }

        function fbm(tx, ty, octs = 3, H = 0.55) {
            let val = 0, amp = 1;
            let fx = tx, fy = ty;
            for (let i = 0; i < octs; i++) {
                val += amp * snoise(fx, fy);
                amp *= H;
                fx *= 2; fy *= 2;
            }
            return val * 0.5 + 0.5;
        }

        // Terrain (unchanged logic)
        function getTerrainData(wx, wy, stab, t, dream) {
            let distAmp = (1 - stab) * (0.2 + dream * 0.3) * 6; // reduced amp
            let nx = wx * 0.1 + t * 0.02;
            let ny = wy * 0.1 + t * 0.02;
            wx += (fbm(nx, ny) - 0.5) * distAmp;
            wy += (fbm(nx + 100, ny + 100) - 0.5) * distAmp;

            let h = (fbm(wx * 0.0025, wy * 0.0025, 5, 0.52) - 0.4) * 1.5; // 5->3? keep 5
            let distH = fbm((wx + Math.sin(t * 0.05) * 500) * 0.015, (wy + Math.cos(t * 0.05) * 500) * 0.015, 4, 0.5) * 0.8 - 0.4;
            h = h * stab + distH * (1 - stab);
            let m = fbm(wx * 0.008 + 123, wy * 0.008 + 456, 3, 0.6);

            return { h, m };
        }

        function clamp(v, min = 0, max = 255) {
            return Math.max(min, Math.min(max, v));
        }

        function terrainColor(h, m, dream, t) {
            let r = 40, g = 35, b = 50;
            if (h < -0.15) { b = 30 + m * 40; g = b * 0.6; }
            else if (h < 0) { b = 50 + m * 30; g = 40 + m * 20; }
            else if (h < 0.25) { r = 90 + m * 20; g = 70 + m * 10; b = 40; }
            else if (h < 0.55) { r = 50; g = 60 + m * 40; b = 40; }
            else if (h < 0.8) { r = 70; g = 65; b = 60; }
            else { r = 140; g = 130; b = 120; }
            // Sepia
            r = r * 1.1; g *= 0.9; b *= 0.8;
            // Dream
            let shift = Math.sin(t * 0.1 + dream * 2) * 25 * dream;
            b += shift;
            if (dream > 1.5) { r = 255 - r; g = 255 - g; b = 255 - b; }
            return [clamp(r), clamp(g), clamp(b), 255];
        }

        // Stability getter (clamped)
        function getStab(wx, wy) {
            let mx = Math.floor((wx + WORLD_OFFSET) / WORLD_CELL_SIZE);
            let my = Math.floor((wy + WORLD_OFFSET) / WORLD_CELL_SIZE);
            mx = Math.max(0, Math.min(MAP_RES - 1, mx));
            my = Math.max(0, Math.min(MAP_RES - 1, my));
            return mapStability[mx + my * MAP_RES];
        }

        // Stars init
        function initStars() {
            for (let i = 0; i < 800; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * WORLD_SIZE * 2,
                    y: (Math.random() - 0.5) * WORLD_SIZE * 2,
                    size: Math.random() * 2 + 0.5,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        // Update stability from ink
        function updateStability() {
            const idata = mapCtx.getImageData(0, 0, MAP_RES, MAP_RES).data;
            for (let i = 0, j = 3; i < TOTAL_MAP_CELLS; i++, j += 4) {
                mapStability[i] = Math.max(mapStability[i], idata[j] / 255);
            }
        }

        // Save/Load (unchanged)
        function saveGame() {
            const sparse = [];
            for (let i = 0; i < TOTAL_MAP_CELLS; i++) {
                if (mapStability[i] > 0.01) sparse.push({ i, s: mapStability[i] });
            }
            localStorage.setItem('dreams_map', JSON.stringify({
                sparse, camX, camY, zoom, dreamState,
                time: performance.now()
            }));
        }

        function loadGame() {
            try {
                const data = JSON.parse(localStorage.getItem('dreams_map') || '{}');
                data.sparse?.forEach(({ i, s }) => { mapStability[i] = s; });
                camX = data.camX || 0;
                camY = data.camY || 0;
                zoom = targetZoom = data.zoom || 0.8;
                targetCamX = camX;
                targetCamY = camY;
                dreamState = data.dreamState || 0;
            } catch (e) {}
        }

        // Audio (unchanged)
        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Drone
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = 32;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.03;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 80;
            osc.connect(filter).connect(gain).connect(audioCtx.destination);
            osc.start();
            drone = { osc, gain, filter };
            // Wind noise
            const bufferSize = audioCtx.sampleRate * 4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const bufData = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) bufData[i] = (Math.random() * 2 - 1) * 0.5;
            const noiseOsc = audioCtx.createBufferSource();
            noiseOsc.buffer = buffer;
            noiseOsc.loop = true;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.015;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 150;
            noiseOsc.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
            noiseOsc.start();
            // LFO
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.12;
            lfo.type = 'sine';
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 15;
            lfo.connect(lfoGain).connect(filter.frequency);
            lfo.start();
        }

        let audioNodes = [];
        function updateAudio() {
            if (!drone) return;
            drone.filter.frequency.value = 40 + dreamState * 20 + Math.sin(time * 0.05) * 10;
            drone.gain.gain.value = 0.02 + instab * 0.03 + dreamState * 0.01;
        }

        function playChime() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.value = 600 + dreamState * 200;
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 1.5);
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(g).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function initAudioIfNeeded() {
            if (audioReady || !audioCtx) return;
            audioReady = true;
            audioCtx.resume();
            initAudio();
        }

        // Lore check
        function checkLore() {
            landmarks.forEach(lm => {
                const dx = lm.x - camX, dy = lm.y - camY;
                if (Math.hypot(dx, dy) < 400 && getStab(lm.x, lm.y) > 0.3 && !loreShown.has(lm.lore)) {
                    loreShown.add(lm.lore);
                    const div = document.createElement('div');
                    div.textContent = lm.lore;
                    loreEl.appendChild(div);
                    loreEl.scrollTop = loreEl.scrollHeight;
                }
            });
        }

        // Landmark draw (fixed scale to screen-fixed size)
        function drawLandmark(lmx, lmy, type, dream) {
            const sx = (lmx - camX) * zoom + cw / 2;
            const sy = (lmy - camY) * zoom + ch / 2;
            if (sx < -200 || sx > cw + 200 || sy < -200 || sy > ch + 200) return;
            ctx.save();
            ctx.translate(sx, sy);
            ctx.scale(1, 1); // Fixed screen size
            ctx.strokeStyle = dream > 0.5 ? `rgba(170,170,255,0.7)` : '#665544';
            ctx.lineWidth = dream > 1 ? 2.5 : 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = 0.9;
            ctx.shadowColor = dream > 1 ? '#44aaff' : '#000';
            ctx.shadowBlur = 8 * dream;

            // ... (all cases unchanged, omitted for brevity)
            switch (type) {
                case 'cathedral':
                    ctx.fillStyle = '#334455';
                    ctx.fillRect(-18, -70, 36, 70);
                    ctx.strokeStyle = '#223344';

                    ctx.moveTo(0, -70); ctx.lineTo(-10, -105); ctx.lineTo(10, -105); ctx.lineTo(0, -70);
                    ctx.moveTo(12, -70); ctx.lineTo(22, -110); ctx.lineTo(2, -110); ctx.lineTo(12, -70);
                    ctx.stroke();

                    ctx.lineWidth = 1;
                    ctx.moveTo(-15, -
